# Edge reverse proxy — DEVELOPMENT
# Fronts the Vite dev server and the backend API on a single origin so the
# browser never deals with CORS or mixed ports. WebSocket upgrade is enabled
# so Vite HMR works through the proxy.

upstream frontend_dev {
    server frontend:3000;
}

upstream backend_api {
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    # API → backend. Strip nothing; backend mounts routes under /api.
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Everything else → Vite dev server (with HMR websocket).
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
